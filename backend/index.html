<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Page with Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h3 {
            margin: 10px 0;
        }
        .add-to-cart {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .add-to-cart:hover {
            background: #218838;
        }
        .cart {
            margin-top: 20px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        .cart h2 {
            text-align: center;
        }
        .cart-items {
            list-style: none;
            padding: 0;
        }
        .cart-items li {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h2>My Card Page with Cart</h2>
    <div class="container" id="cardContainer">
        <!-- Cards will be added dynamically -->
    </div>

    <div class="cart">
        <h2>Shopping Cart</h2>
        <ul class="cart-items" id="cartItems">
            <li>No items in cart</li>
        </ul>
    </div>

    <script>
        const cardData = [
            { id: 1, title: "Wireless Headphone", image: "/frontend/public/assets/images/headphone2.jpg", description: "This is card 1" },
            { id: 2, title: "Card 2", image: "/frontend/public/assets/images/headphones.jpg", description: "This is card 2" },
            { id: 3, title: "Card 3", image: "/frontend/public/assets/images/ipad.jpg", description: "This is card 3" },
            
            { id: 4, title: "Card 2", image: "/frontend/public/assets/images/headphones.jpg", description: "This is card 2" },
            
            { id: 5, title: "Card 2", image: "/frontend/public/assets/images/bicycle.jpg", description: "This is card 2" },
            
            { id: 6, title: "Card 2", image: "/frontend/public/assets/images/bicycle2.jpg", description: "This is card 2" },
            
            { id: 7, title: "Card 2", image: "/frontend/public/assets/images/headphones.jpg", description: "This is card 2" }
        ];

        let cart = [];

        function renderCards() {
            const container = document.getElementById("cardContainer");
            cardData.forEach(card => {
                const cardElement = document.createElement("div");
                cardElement.classList.add("card");
                cardElement.innerHTML = `
                    <img src="${card.image}" alt="${card.title}">
                    <h3>${card.title}</h3>
                    <p>${card.description}</p>
                    <button class="add-to-cart" onclick="addToCart(${card.id})">Add to Cart</button>
                `;
                container.appendChild(cardElement);
            });
        }

        function addToCart(id) {
            const item = cardData.find(card => card.id === id);
            if (item) {
                cart.push(item);
                updateCart();
            }
        }

        function updateCart() {
            const cartList = document.getElementById("cartItems");
            cartList.innerHTML = "";
            if (cart.length === 0) {
                cartList.innerHTML = "<li>No items in cart</li>";
            } else {
                cart.forEach(item => {
                    const li = document.createElement("li");
                    li.textContent = item.title;
                    cartList.appendChild(li);
                });
            }
        }

        renderCards();
    </script>

</body>
</html>
